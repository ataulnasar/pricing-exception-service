name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # The PostgreSQL tests use Testcontainers and are skipped when Docker is missing.
      # GitHub runners have Docker, so a skip here means something is broken: fail loudly.
      - name: Fail if the PostgreSQL tests were skipped
        run: |
          report=target/surefire-reports/TEST-se.ataulnasar.pricingexception.persistence.PostgresMigrationTest.xml
          test -f "$report" || { echo "PostgreSQL test report missing"; exit 1; }
          grep -q 'skipped="0"' "$report" || { echo "PostgreSQL tests were skipped:"; grep -o 'tests="[0-9]*"\|skipped="[0-9]*"' "$report"; exit 1; }
          echo "PostgreSQL tests ran: $(grep -o 'tests="[0-9]*"' "$report")"
