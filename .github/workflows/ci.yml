name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # The PostgreSQL tests use Testcontainers and are skipped when Docker is missing.
      # GitHub runners have Docker, so a skip here means something is broken: fail loudly.
      - name: Fail if the PostgreSQL tests were skipped
        run: |
          for cls in persistence.PostgresMigrationTest persistence.PostgresApiIT; do
            report=target/surefire-reports/TEST-se.ataulnasar.pricingexception.$cls.xml
            test -f "$report" || { echo "PostgreSQL test report missing: $cls"; exit 1; }
            grep -q 'skipped="0"' "$report" || { echo "PostgreSQL tests were skipped in $cls:"; grep -o 'tests="[0-9]*"\|skipped="[0-9]*"' "$report"; exit 1; }
            echo "PostgreSQL tests ran in $cls: $(grep -o 'tests="[0-9]*"' "$report")"
          done

  ai-review-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unit tests of the AI review agent (standard library only, no API key needed)
        run: python3 -m unittest discover -s agents/tests -v

      - name: Every eval patch still applies to the current code (they break after a refactor)
        run: for p in agents/eval/*.patch; do git apply --check "$p" || { echo "$p no longer applies; regenerate it"; exit 1; }; done
