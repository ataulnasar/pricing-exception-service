spring.application.name=pricing-exception-service

# Default profile: in-memory H2 with schema + local demo data. Flyway owns the schema.
spring.datasource.url=jdbc:h2:mem:pricing;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Strict JSON numbers: whole basis points only, and no "40" (string) where a number is expected.
spring.jackson.deserialization.accept-float-as-int=false

# Business configuration
pricing.max-discount-bps=100
# Idempotency-Key records: how long a stored response can be replayed, and how often expired ones are purged
pricing.idempotency.ttl=PT24H
pricing.idempotency.purge-interval=PT1H
